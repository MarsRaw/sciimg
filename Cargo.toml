[package]
name = "sciimg"
version = "0.5.0"
authors = ["Kevin M. Gill <apoapsys@gmail.com>"]
edition = "2021"
description = "Base support for planetary science image processing"
repository = "https://github.com/kmgill/sciimg"
readme = "README.md"
keywords = ["planetary", "astrophotography", "science", "imaging"]
license = "MIT"

[features]
default = ["full"]
rayon = ["dep:rayon"]
wgpu = [
    "dep:wgpu",
    "dep:glam",
    "dep:pollster",
    "dep:log",
    "dep:encase",
    "dep:pretty_env_logger",
]
full = ["wgpu", "rayon"]


[dependencies]
chrono = "0.4.19"
image = "0.24.5"
imageproc = "0.23.0"
lab = "0.11.0"
memmap = "0.7.0"
rayon = { version = "1.7.0", optional = true }
serde = { version = "1.0.125", features = ["derive"] }
string-builder = "0.2.0"
itertools = "0.10.5"
anyhow = "1.0.65"

# GPU DEPS:
wgpu = { git = "https://github.com/gfx-rs/wgpu", branch = "trunk", optional = true }
# thiserror = "2.0.12" # TODO: ditch anyhow, use this we need better errors here.
encase = { version = "0.10.0", features = ["glam", "mint"], optional = true }
glam = { version = "0.29.0", optional = true }                                #NOTE: keep in sync with whatever encase uses
pollster = { version = "0.4.0", optional = true }
log = { version = "0.4.26", optional = true }
pretty_env_logger = { version = "0.5.0", optional = true }


[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "gaussian"
harness = false
required-features = ["wgpu", "rayon"]

[[example]]
name = "gpu_gaussian"
required-features = ["wgpu"]
