[package]
name = "sciimg"
version = "0.6.0"
authors = ["Kevin M. Gill <apoapsys@gmail.com>"]
edition = "2021"
description = "Base support for planetary science image processing"
repository = "https://github.com/kmgill/sciimg"
readme = "README.md"
keywords = ["planetary", "astrophotography", "science", "imaging"]
license = "MIT"

[features]
rayon = ["dep:rayon"]
default = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rayon)'] }

[dependencies]
chrono = "0.4.19"
image = "0.25.9"
imageproc = "0.26.0"
lab = "0.11.0"
memmap = "0.7.0"
rayon = { version = "1.7.0", optional = true }
serde = { version = "1.0.125", features = ["derive"] }
string-builder = "0.2.0"
itertools = "0.14.0"
anyhow = "1.0.65"
dng = "1.5.0"
jpeg-decoder = "0.3.0"

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "gaussian"
harness = false

[patch.crates-io]
jpeg-decoder = { git = "https://github.com/kmgill/jpeg-decoder.git", branch = "optional-zero-ac63" }
